<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Jicofuw Legal</title>
<style>
:root{--moss:#1C2C22;--leaf:#2F7A58;--sage:#6EAE95;--mist:#E8F2EC;--mute:#9BB5A8;--line:#2A4034}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--moss);color:var(--mist);font-family:Georgia,"Iowan Old Style",Palatino,serif;line-height:1.6}
body{min-height:100vh;background:radial-gradient(120% 70% at 10% -10%,#1c3a2c 0%,transparent 55%),linear-gradient(180deg,#1E3228,var(--moss))}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 72px}
h1{font-size:34px;margin:0 0 8px}
.meta{font-family:-apple-system,sans-serif;color:var(--mute);font-size:14px;margin:0 0 24px}
.grid{display:grid;gap:12px}
a.card{display:block;text-decoration:none;color:var(--mist);padding:18px;border-radius:18px;background:rgba(21,36,28,.9);border:1px solid var(--line)}
a.card:hover{border-color:var(--sage)}
a.card b{display:block;font-family:-apple-system,sans-serif;color:var(--sage);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
a.card span{font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Jicofuw Legal</h1>
  <p class="meta">Operator: Jicofuw · On-device evening helper</p>
  <div class="grid">
    <a class="card" href="privacy.html"><b>Policy</b><span>Privacy Policy</span></a>
    <a class="card" href="terms.html"><b>Terms</b><span>Terms of Use</span></a>
    <a class="card" href="community.html"><b>Community</b><span>Community Guidelines</span></a>
    <a class="card" href="support.html"><b>Help</b><span>Support</span></a>
  </div>
</div>
</body>
</html>
